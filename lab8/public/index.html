<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Node Server</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    nav {
      background-color: #1e293b;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav .logo {
      color: #fff;
      font-weight: 700;
      font-size: 1.2rem;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-left: 1.5rem;
      transition: color 0.2s ease;
    }

    nav a:hover, nav a.active {
      color: #38bdf8;
    }

    main {
      max-width: 800px;
      margin: 4rem auto;
      padding: 2.5rem;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      font-size: 2.25rem;
      color: #0f172a;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      background-color: #0284c7;
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">Node.js Web App</div>
    <div>
      <a href="/" class="active">Home</a>
      <a href="/about.html">About</a>
    </div>
  </nav>

  <main>
    <h1>Welcome Home</h1>
    <p>This page is dynamically served using custom Node.js HTTP server module with built-in request logging and robust error handling.</p>
    <a href="/about.html" class="btn">Learn More About Us</a>
  </main>

</body>
</html>
